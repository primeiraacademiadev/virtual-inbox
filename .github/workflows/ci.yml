name: CI
on:
  push:
  pull_request:
jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install backend
        run: npm ci --ignore-scripts --no-fund
      - name: Install console
        run: npm ci --prefix web --ignore-scripts --no-fund
      - name: Tests
        run: npm test
      - name: Integrated backend and console build
        run: npm run build
      - name: Backend dependency audit
        run: npm audit --audit-level=high
      - name: Console dependency audit
        run: npm audit --prefix web --audit-level=high

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        with:
          node-version: '26'
      - name: Install dependencies
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix web --ignore-scripts --no-fund
      - name: Run tests with LCOV
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        run: npm run test:coverage
      - name: SonarQube scan
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Missing SonarQube credentials
        if: env.SONAR_HOST_URL == '' || env.SONAR_TOKEN == ''
        run: echo "::notice::SonarQube scan skipped. Add SONAR_HOST_URL and SONAR_TOKEN repository secrets."
