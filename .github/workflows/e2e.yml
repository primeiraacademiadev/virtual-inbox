name: Virtual Inbox E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'testing/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
jobs:
  managed-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Install application
        run: |
          npm ci --ignore-scripts
          npm ci --prefix web --ignore-scripts
      - name: Install test harness
        run: npm ci --prefix testing --ignore-scripts
      - name: Install Playwright Chromium
        run: ./testing/node_modules/.bin/playwright install --with-deps chromium
      - name: Build integrated application
        run: npm run build
      - name: Run managed E2E suite
        run: npm run test:all
      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: virtual-inbox-e2e
          path: |
            testing/reports/html
            testing/reports/junit.xml
            testing/reports/artifacts
          retention-days: 14

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build runtime Docker image
        run: docker build --tag virtual-inbox:ci .
      - name: Start actual runtime image
        run: |
          docker run -d --name virtual-inbox-ci \
            -p 127.0.0.1:13000:3000 \
            -p 127.0.0.1:12525:2525 \
            virtual-inbox:ci
      - name: Validate HTTP and SMTP on real container
        run: |
          node --input-type=module <<'NODE'
          import {connect} from 'node:net';
          import {setTimeout as delay} from 'node:timers/promises';
          let healthy=false;
          for(let attempt=0;attempt<60;attempt++){
            try{
              const response=await fetch('http://127.0.0.1:13000/health');
              if(response.ok){healthy=true;break}
            }catch{}
            await delay(500);
          }
          if(!healthy)throw Error('Docker runtime did not become healthy');
          await new Promise((resolve,reject)=>{
            const socket=connect({host:'127.0.0.1',port:12525});
            socket.setTimeout(5000,()=>socket.destroy(Error('SMTP greeting timed out')));
            socket.once('data',data=>{
              const greeting=data.toString('utf8');
              socket.end();
              greeting.startsWith('220')?resolve():reject(Error('Unexpected SMTP greeting: '+greeting));
            });
            socket.once('error',reject);
          });
          console.log('Docker image passed health and SMTP listener checks');
          NODE
      - name: Collect container logs
        if: always()
        run: docker logs virtual-inbox-ci || true
      - name: Remove test container
        if: always()
        run: docker rm -f virtual-inbox-ci || true
