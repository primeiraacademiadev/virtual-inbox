name: SonarCloud main gate diagnostics
on:
  push:
    branches: [fix/sonar-main-gate-followup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Read main branch Quality Gate metrics
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN not available for this workflow"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = "https://sonarcloud.io"
          token = os.environ["SONAR_TOKEN"]
          key = "primeiraacademiadev_virtual-inbox"
          def get(path, params):
              url = base + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          gate = get("/api/qualitygates/project_status", {"projectKey": key, "branch": "main"})["projectStatus"]
          print("MAIN QUALITY GATE:", gate.get("status"))
          print("FAILING CONDITIONS:")
          for condition in gate.get("conditions", []):
              if condition.get("status") != "OK":
                  print(json.dumps({k: condition.get(k) for k in ("metricKey", "status", "actualValue", "errorThreshold", "comparator")}, sort_keys=True))
          print("ALL CONDITIONS:")
          for condition in gate.get("conditions", []):
              print(json.dumps({k: condition.get(k) for k in ("metricKey", "status", "actualValue", "errorThreshold")}, sort_keys=True))
          try:
              data = get("/api/measures/component", {"component": key, "branch": "main", "metricKeys": "new_coverage,new_duplicated_lines_density,new_lines_to_cover,new_uncovered_lines,new_lines,new_duplicated_lines,coverage,duplicated_lines_density"})
              print("MAIN METRICS:")
              for metric in data.get("component", {}).get("measures", []):
                  print(json.dumps({"metric":metric.get("metric"),"value":metric.get("value"),"periods":metric.get("periods")},sort_keys=True))
          except Exception as error:
              print("Detailed measures request unavailable:",type(error).__name__)
          PY
