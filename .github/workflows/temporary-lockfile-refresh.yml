name: One-time lockfile regeneration
on:
  push:
    branches: [fix/audit-c8-transitive-2026-11]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile and overrides
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix web --ignore-scripts --no-fund
          npm ls c8 test-exclude glob minimatch
          npm audit --audit-level=moderate
          npm run test:coverage
      - name: Commit only lockfile change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate lockfile for patched coverage dependencies"
            git push origin HEAD:fix/audit-c8-transitive-2026-11
          fi
