name: Temporary SonarCloud PR coverage diagnostics
on:
  push:
    branches: [feat/console-ux-local-demo]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Print PR 18 coverage by file
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ["SONAR_TOKEN"]
          def request(endpoint,params):
              req=urllib.request.Request("https://sonarcloud.io"+endpoint+"?"+urllib.parse.urlencode(params),headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as res:return json.load(res)
          key="primeiraacademiadev_virtual-inbox"
          status=request("/api/qualitygates/project_status",{"projectKey":key,"pullRequest":"18"})["projectStatus"]
          print("QUALITY GATE",json.dumps(status))
          metrics="new_coverage,new_lines_to_cover,new_uncovered_lines,new_lines,coverage"
          tree=request("/api/measures/component_tree",{"component":key,"pullRequest":"18","qualifiers":"FIL","metricKeys":metrics,"ps":300})
          for c in tree.get("components",[]):
              ms={}
              for m in c.get("measures",[]):
                  val=m.get("value") or next((p.get("value") for p in m.get("periods",[]) if p.get("index")==1),"0")
                  try:ms[m["metric"]]=float(val)
                  except:pass
              if ms.get("new_lines_to_cover",0) or ms.get("new_lines",0):
                  print("FILE",c.get("path"),json.dumps(ms,sort_keys=True))
          PY
